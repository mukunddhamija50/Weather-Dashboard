<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="19.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Dashboard</h1>
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Enter city name">
                <button id="searchBtn">Search</button>
            </div>
        </header>

        <main>
            <div id="currWeather" class="weather-card">
                <div id="weatherIcon"></div>
                <div id="temperature">--°C</div>
                <div id="weatherDescription">---</div>
                <div id="feelsLike">Feels Like ---°C</div>
                <div id="humidity">--% Humidity</div>
                <div id="windSpeed">--- m/s</div>
            </div>
            
            <div id="forecastSection" class="forecast-section">
                <h2>5 Day Forecast</h2>
                <div id="forecastContainer" class="forecast-grid"></div>
            </div>
        </main>

        <footer>
            <p>Weather Dashboard © 2026</p>
        </footer>
    </div>

    <script src="19.js"></script>
</body>
</html>
